<nav class="bg-white sticky top-0 z-[100] shadow-lg">
  <div class="py-4 containerClass flex justify-between items-center">
    <img
      src="assets/logo.svg"
      routerLink="/"
      alt="logo"
      class="cursor-pointer"
    />

    <div class="hidden md:flex gap-6">
      @for(item of navItems;track $index){
      <a [routerLink]="item.path" class="font-semibold text-[#810EA7]">
        {{ item.name }}
        <span
          routerLinkActive="rounded-full h-2 w-2 bg-[#810EA7] mx-auto block"
          [routerLinkActiveOptions]="{ exact: true }"
        ></span>
      </a>
      }
    </div>

    <div class="flex gap-2 md:gap-4 items-center">
      <div
        class="flex flex-col justify-center cursor-pointer"
        routerLink="/cart"
      >
        <div
          class="bg-[#810EA7] text-white w-5 h-5 text-[9px] flex justify-center items-center rounded-full ml-2 -mb-1"
        >
          <p>99</p>
        </div>
        <img src="assets/cart.svg" alt="cart" class="h-7 w-7" />
      </div>
      <app-button
        text="Sign Up"
        class="text-white bg-[#810EA7] px-6 py-2 rounded-lg text-sm cursor-pointer"
        routerLink="/auth/login"
      />
    </div>
  </div>
</nav>
