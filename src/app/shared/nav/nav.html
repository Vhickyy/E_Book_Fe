<nav
  [ngClass]="{
    'bg-white shadow-md fixed top-0': scrolled,
  }"
  class="top-0 z-[100] bg-transparent w-full transition-all duration-300"
>
  <div class="py-6 containerClass flex justify-between items-center">
    <!-- <img
      src="assets/logo.svg"
      routerLink="/"
      alt="logo"
      class="cursor-pointer"
    /> -->
    <app-svgs [svg]="logosvg" svgclass="w-7 h-7 text-primary" />

    <div class="hidden md:flex gap-6">
      @for (item of navItems; track $index) {
        <a [routerLink]="item.path" class="font-semibold text-primary">
          {{ item.name }}
          <span
            routerLinkActive="rounded-full h-2 w-2 bg-primary mx-auto block"
            [routerLinkActiveOptions]="{ exact: true }"
          ></span>
        </a>
      }
    </div>

    <div class="flex gap-3 md:gap-4 items-center">
      <div
        class="flex flex-col justify-center cursor-pointer relative"
        routerLink="/cart"
      >
        <div
          class="bg-primary text-white w-5 h-5 text-[9px] flex justify-center items-center rounded-full ml-2 -mb-1 absolute -top-4"
        >
          <p>99</p>
        </div>
        <app-svgs [svg]="cartsvg" svgclass="w-7 h-7 text-primary" />
      </div>
      <div (click)="mobile.set(true)" class="w-fit md:hidden">
        <app-svgs [svg]="menusvg" svgclass="w-7 h-7 text-primary" />
      </div>
      <app-button
        text="Sign Up"
        class="text-white bg-primary px-6 py-2 rounded-lg text-sm cursor-pointer hidden md:block"
        routerLink="/auth/login"
      />
    </div>
  </div>

  @if (mobile()) {
    <app-mobile-nav class="md:hidden" [(mobile)]="mobile" />
  }
</nav>
