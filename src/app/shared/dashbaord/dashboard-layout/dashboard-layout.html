<section class="grid md:grid-cols-[minmax(250px,_auto)_1fr] h-screen">
  <app-sidebar [(isSidebarOpen)]="isSidebarOpen" />
  <div class="flex flex-col h-screen overflow-y-auto">
    <div class="sticky top-0 py-6 z-10 shadow-lg bg-white">
      <div class="w-[90%] mx-auto flex justify-between items-center">
        <button class="md:hidden" (click)="isSidebarOpen = true">☰</button>
        <p class="text-primary font-semibold text-4xl font-[playball]">
          Hello Vee!
        </p>
        <div class="flex gap-4">
          <div class="w-8 h-8 rounded-full bg-primary"></div>
          <div class="w-8 h-8 rounded-full bg-primary"></div>
          <div class="w-8 h-8 rounded-full bg-primary/30 overflow-hidden">
            <img src="/assets/img/me.png" alt="" />
          </div>
        </div>
      </div>
    </div>
    <div class="flex-1 bg-[#f5f5f5] py-10 flex">
      <div class="w-[90%] mx-auto">
        <router-outlet />
      </div>
    </div>
  </div>
</section>
