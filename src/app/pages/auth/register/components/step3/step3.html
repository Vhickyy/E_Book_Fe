<h5 class="text-center font-semibold text-[#000000C4]">Preview</h5>
<p class="text-center text-sm text-[#00000091] w-[70%] mx-auto">
  Confirm your account details, if something is out of place you can
  <span>Edit</span>
</p>

<div>
  <div
    class="w-20 h-20 md:w-[6rem] md:h-[6rem] border-2 border-[#810EA780] rounded-lg mx-auto"
  >
    <img
      [src]="regService.imagePreview()"
      alt="selectFile"
      class="h-full w-full object-cover"
    />
  </div>
</div>

<div class="flex justify-between mt-6">
  <p class="cursor-pointer" (click)="regService.activeStep.set(0)">Edit</p>
  <button
    class="text-white bg-[#810EA7] py-2 rounded-lg px-8 font-semibold cursor-pointer text-sm"
  >
    Create Account
  </button>
</div>
