<app-auth-layout
  ><form
    class="bg-white py-8 px-6 md:px-12 rounded-xl w-[90%] mx-auto max-w-[35rem] grid gap-6"
  >
    <div>
      <p>Enter the code sent to your mail.</p>
      <p>Let's help you retrieve it</p>
    </div>
    <input
      type="text"
      placeholder="xxxxxx"
      class="outline-none border-2 rounded-xl w-full p-3 border-[#810EA780] text-sm placeholder:text-[#00000091]"
    />
    <app-button text="Submit" styles="bg-[#810EA7] text-white p-3" /></form
></app-auth-layout>
