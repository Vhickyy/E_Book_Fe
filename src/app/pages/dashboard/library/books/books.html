<section class="h-full flex-1">
  <div class="flex-1 flex gap-6 h-full">
    @if (!data().length) {
      <div
        class="flex-1 bg-white rounded-xl flex flex-col gap-4 justify-center items-center h-full shadow-md"
      >
        <div class="w-[30%] mx-auto">
          <img src="/assets/empty_book_data.svg" alt="" class="w-full" />
        </div>
        <p class="text-lg font-semibold tracking-wide">
          Your library is current empty.
        </p>
        <app-button
          text="Go To Books"
          routerLink="/books"
          styles="bg-primary  text-white px-8 py-2"
        />
      </div>
    } @else {
      <div class="flex-1 flex flex-col justify-between gap-4">
        <div class="grid grid-cols-2 md:grid-cols-3 h-auto gap-4">
          @for (item of data(); track $index) {
            <app-book [book]="item" />
          }
        </div>
        <app-pagination
          [(data)]="data"
          [(pageIndex)]="pageIndex"
          [(pageSize)]="pageSize"
          [(totalItems)]="totalItems"
          [list]="books"
        />
      </div>
    }

    <div class="w-[30%] flex-col gap-4 md:flex hidden">
      <div class="bg-white shadow-lg rounded-xl w-full h-full"></div>
      <div class="bg-white shadow-lg rounded-xl w-full h-full"></div>
    </div>
  </div>
</section>
