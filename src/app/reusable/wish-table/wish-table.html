<table
  mat-table
  [dataSource]="data()"
  matSort
  class="!border-b !border-primary/30 !bg-whites shadow-lg mb-6 table-auto w-fit"
>
  @for (column of columns(); track column.key) {
    <ng-container [matColumnDef]="column.key">
      <!-- mat-sort-header -->
      <th
        mat-header-cell
        *matHeaderCellDef
        class="border !border-primary/30 whitespace-nowrap !text-center"
      >
        {{ column.label }}
      </th>

      <td
        mat-cell
        *matCellDef="let element; index"
        class="border !border-primary/30 !text-center"
      >
        @if (templates()[column.key]) {
          <ng-container
            *ngTemplateOutlet="
              templates()[column.key];
              context: { $implicit: element }
            "
          />
        } @else {
          {{ element[column.key] }}
        }
      </td>
    </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="displayedcolumns()"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedcolumns()"></tr>

  <tr class="mat-row" *matNoDataRow>
    <td class="mat-cell" colspan="6">
      No data matching the filter "{{ searchText() }}"
    </td>
  </tr>
</table>
