<div
  class="fixed bg-white w-[15rem] top-0 bottom-0 py-6 px-10 h-full z-[1000] right-0"
>
  <img
    src="assets/logo.svg"
    alt="logo"
    class="cursor-pointer pb-6"
    (click)="closeNav()"
  />
  <div class="flex-col flex gap-4">
    @for (item of navItems; track $index) {
      <a [routerLink]="item.path" class="font-semibold text-primary">
        {{ item.name }}
        <span
          routerLinkActive="rounded-full h-1 w-4 bg-primary -mt-1 block"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeNav()"
        ></span>
      </a>
    }
    <p>Cart</p>
    <app-button
      text="Log In"
      class="text-white bg-primary px-6 py-2 rounded-lg text-sm cursor-pointer"
      routerLink="/auth/login"
    />
    <app-button
      text="Sign Up"
      class="border-2 border-primary px-6 py-2 rounded-lg text-sm cursor-pointer"
      routerLink="/auth/login"
      styles="text-primary"
    />
  </div>
</div>
